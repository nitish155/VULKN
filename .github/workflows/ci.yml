name: VULKN CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:

  backend-test:
    name: Backend & Scanner Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q .

      - name: Run tests
        run: |
          pip install pytest httpx
          pytest tests/ -v --tb=short
          exit_code=$?
          if [ "$exit_code" -eq 5 ]; then
            echo "No tests yet - skipping"
            exit 0
          fi
          exit "$exit_code"

      - name: Health check - verify FastAPI imports
        run: |
          python -c "from fastapi import FastAPI; print('FastAPI OK')"

  docker-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Create .env from example
        run: |
          cp .env.example .env
          echo "POSTGRES_DB=vulkn" >> .env
          echo "POSTGRES_USER=vulkn_user" >> .env
          echo "POSTGRES_PASSWORD=testpass" >> .env

      - name: Validate docker-compose syntax
        run: |
          docker-compose -f infra/docker-compose.dev.yml config