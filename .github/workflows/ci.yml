name: VULKN CI Pipeline

on:
  push:
    branches: ["*"]       
  pull_request:
    branches: [main]       

jobs:

  # ── Python Backend Tests ─────────────────────────────
  backend-test:
    name: Backend & Scanner Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax (no crashes)
        run: |
          python -c "import main; print('main.py OK')"

      - name: Run tests (if any exist)
        run: |
          pip install pytest
          pytest tests/ -v --tb=short || echo "No tests yet - skipping"

      - name: Health check - verify FastAPI imports
        run: |
          python -c "from fastapi import FastAPI; print('FastAPI OK')"

  # ── Docker Compose Validation ────────────────────────
  docker-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Create .env from example
        run: |
          cp .env.example .env
          echo "POSTGRES_DB=vulkn" >> .env
          echo "POSTGRES_USER=vulkn_user" >> .env
          echo "POSTGRES_PASSWORD=testpass" >> .env

      - name: Validate docker-compose syntax
        run: |
          docker-compose -f infra/docker-compose.dev.yml config