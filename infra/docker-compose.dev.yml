services:

  # ── PostgreSQL ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine 
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── Redis ────────────────────────────────────────────
  redis:
    image: redis:7-alpine 
    ports:
      - "6379:6379"

  # ── MongoDB ──────────────────────────────────────────
  mongo:
    image: mongo:7.0 
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

# ── Persistent Volumes ───────────────────────────────
volumes:
  postgres_data:
  mongo_data:
